name: Analog stick test build

on:
  push:
    branches:
      - ui/analog-stick-control
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: scroblin-analog-stick-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report build result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          PR_NUMBER=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi
          if [ "$BUILD_OUTCOME" = "success" ]; then
            gh pr comment "$PR_NUMBER" --body "Analog-stick CI build succeeded. Run ID: ${GITHUB_RUN_ID}. Artifact: scroblin-analog-stick-debug"
          else
            gh pr comment "$PR_NUMBER" --body "Analog-stick CI build failed. Run ID: ${GITHUB_RUN_ID}."
          fi

      - name: Fail workflow when Gradle fails
        if: steps.build.outcome != 'success'
        run: exit 1
